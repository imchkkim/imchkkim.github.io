<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480"><rect width="920" height="480" fill="#fff"/>
<g font-family="'Noto Sans KR','Noto Sans CJK KR',sans-serif" fill="#111">
<text x="215" y="64" font-size="16" font-weight="700" text-anchor="middle">대각 행렬 두 개 (= 동전 두 개)</text>
<text x="215" y="86" font-size="14" text-anchor="middle" fill="#444">곱하는 순서가 상관없다</text>
<circle cx="215" cy="275" r="165" fill="#f6f6f6" stroke="#888" stroke-width="1.5"/>
<line x1="50" y1="275" x2="380" y2="275" stroke="#ccc"/>
<line x1="215" y1="110" x2="215" y2="440" stroke="#ccc"/>
<line x1="215.0" y1="143.0" x2="215.0" y2="341.0" stroke="#0e9aa7" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="215.0" cy="143.0" r="5" fill="#333"/>
<text x="193.0" y="149.0" font-size="17" font-weight="700">ρ</text>
<circle cx="215.0" cy="341.0" r="5" fill="#333"/>
<text x="193.0" y="347.0" font-size="17" font-weight="700">σ</text>
<circle cx="215.0" cy="242.0" r="6.5" fill="#fff" stroke="#0e9aa7" stroke-width="3"/>
<circle cx="215.0" cy="221.3" r="6.5" fill="#c2552d"/>
<line x1="215.0" y1="242.0" x2="271.0" y2="271.0" stroke="#999" stroke-width="1"/>
<text x="275.0" y="276.0" font-size="14" fill="#0e9aa7" text-anchor="start" stroke="#fff" stroke-width="4" paint-order="stroke">섞기 (ρ+σ)/2</text>
<line x1="215.0" y1="221.3" x2="271.0" y2="186.4" stroke="#999" stroke-width="1"/>
<text x="275.0" y="191.4" font-size="14" fill="#c2552d" text-anchor="start" stroke="#fff" stroke-width="4" paint-order="stroke">곱하는 세 방법이 한 점</text>
<text x="655" y="64" font-size="16" font-weight="700" text-anchor="middle">대각이 아닌 행렬이 끼면</text>
<text x="655" y="86" font-size="14" text-anchor="middle" fill="#444">AB ≠ BA: 곱해서 잡은 가운데가 셋으로 갈린다</text>
<circle cx="655" cy="275" r="165" fill="#f6f6f6" stroke="#888" stroke-width="1.5"/>
<line x1="490" y1="275" x2="820" y2="275" stroke="#ccc"/>
<line x1="655" y1="110" x2="655" y2="440" stroke="#ccc"/>
<line x1="655.0" y1="143.0" x2="770.5" y2="324.5" stroke="#0e9aa7" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="655.0" cy="143.0" r="5" fill="#333"/>
<text x="633.0" y="149.0" font-size="17" font-weight="700">ρ</text>
<circle cx="770.5" cy="324.5" r="5" fill="#333"/>
<text x="748.5" y="330.5" font-size="17" font-weight="700">σ</text>
<circle cx="712.8" cy="233.8" r="6.5" fill="#fff" stroke="#0e9aa7" stroke-width="3"/>
<circle cx="723.4" cy="222.6" r="6.5" fill="#c2552d"/>
<rect x="709.3" y="197.2" width="12" height="12" fill="#c2552d"/>
<path d="M740.9,229.3 L748.4,242.8 L733.4,242.8 Z" fill="#c2552d"/>
<line x1="712.8" y1="233.8" x2="629.0" y2="365.0" stroke="#999" stroke-width="1"/>
<text x="625.0" y="370.0" font-size="14" fill="#0e9aa7" text-anchor="end" stroke="#fff" stroke-width="4" paint-order="stroke">섞기 (ρ+σ)/2</text>
<line x1="723.4" y1="222.6" x2="771.0" y2="165.0" stroke="#999" stroke-width="1"/>
<text x="775.0" y="170.0" font-size="14" fill="#c2552d" text-anchor="start" stroke="#fff" stroke-width="4" paint-order="stroke">로그 평균</text>
<line x1="715.3" y1="203.2" x2="691.0" y2="108.0" stroke="#999" stroke-width="1"/>
<text x="695.0" y="113.0" font-size="14" fill="#c2552d" text-anchor="start" stroke="#fff" stroke-width="4" paint-order="stroke">ρ 먼저 곱하기</text>
<line x1="740.9" y1="237.3" x2="791.0" y2="300.0" stroke="#999" stroke-width="1"/>
<text x="795.0" y="305.0" font-size="14" fill="#c2552d" text-anchor="start" stroke="#fff" stroke-width="4" paint-order="stroke">σ 먼저 곱하기</text>
<text x="460.0" y="466" font-size="13" text-anchor="middle" fill="#555">원판의 한 점 = 2×2 밀도 행렬 ½[[1+z, x], [x, 1−z]] 하나. 세로 지름 위의 점이 대각 행렬이다.</text>
</g></svg>