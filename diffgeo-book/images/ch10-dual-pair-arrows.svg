<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Pretendard, 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker>
  </defs>
  <rect x="0" y="0" width="560" height="360" rx="10" fill="#ffffff"/>
  <!-- 윗줄: ∇ 로 옮기는 Y -->
  <text x="20" y="34" font-size="18" fill="#222">윗줄: <tspan fill="#e8710a" font-style="italic" font-weight="700">Y</tspan>를 접속 <tspan fill="#9467bd" font-weight="700">∇</tspan>로 옮긴다</text>
  <line x1="20" y1="90" x2="540" y2="90" stroke="#999" stroke-width="1.5"/>
  <line x1="40" y1="80" x2="40" y2="100" stroke="#555" stroke-width="2"/>
  <line x1="300" y1="80" x2="300" y2="100" stroke="#555" stroke-width="2"/>
  <line x1="40" y1="90" x2="140" y2="90" stroke="#e8710a" stroke-width="5" marker-end="url(#hd)"/>
  <line x1="300" y1="90" x2="350" y2="90" stroke="#e8710a" stroke-width="5" marker-end="url(#hd)"/>
  <text x="40" y="126" font-size="17" fill="#222">출발: 길이 1</text>
  <text x="300" y="126" font-size="17" fill="#222">도착: 길이 0.5</text>
  <path d="M150,66 Q220,46 290,66" fill="none" stroke="#9467bd" stroke-width="2" marker-end="url(#hv)"/>
  <defs><marker id="hv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9467bd"/></marker>
  <marker id="hp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d4449f"/></marker></defs>
  <text x="205" y="58" font-size="17" fill="#9467bd" font-weight="700">∇</text>
  <!-- 아랫줄: ∇* 로 옮기는 Z -->
  <text x="20" y="176" font-size="18" fill="#222">아랫줄: <tspan fill="#e8710a" font-style="italic" font-weight="700">Z</tspan>를 짝 <tspan fill="#d4449f" font-weight="700">∇*</tspan>로 옮긴다</text>
  <line x1="20" y1="232" x2="540" y2="232" stroke="#999" stroke-width="1.5"/>
  <line x1="40" y1="222" x2="40" y2="242" stroke="#555" stroke-width="2"/>
  <line x1="300" y1="222" x2="300" y2="242" stroke="#555" stroke-width="2"/>
  <line x1="40" y1="232" x2="140" y2="232" stroke="#e8710a" stroke-width="5" marker-end="url(#hd)"/>
  <line x1="300" y1="232" x2="500" y2="232" stroke="#e8710a" stroke-width="5" marker-end="url(#hd)"/>
  <text x="40" y="268" font-size="17" fill="#222">출발: 길이 1</text>
  <text x="300" y="268" font-size="17" fill="#222">도착: 길이 2</text>
  <path d="M150,208 Q220,188 290,208" fill="none" stroke="#d4449f" stroke-width="2" marker-end="url(#hp)"/>
  <text x="200" y="200" font-size="17" fill="#d4449f" font-weight="700">∇*</text>
  <!-- 내적 -->
  <rect x="20" y="292" width="520" height="52" rx="8" fill="#f4f4f4" stroke="#ccc"/>
  <text x="280" y="325" font-size="18" fill="#222" text-anchor="middle">내적(두 길이의 곱): 1 × 1 = 1 → 0.5 × 2 = 1</text>
</svg>
