<text x="490" y="228" font-size="21" text-anchor="middle" fill="#a100c1">5</text>
<line x1="93.0" y1="125.0" x2="261.0" y2="125.0" stroke="#1f77b4" stroke-width="5"/><polygon points="255.3,134.4 273.0,125.0 255.3,115.6" fill="#1f77b4"/>
<text x="183.0" y="108" font-size="26" font-weight="700" fill="#1f77b4" text-anchor="middle">v</text>
<text x="280.0" y="262" font-size="22" text-anchor="middle">v가 두 줄을 넘는다 → df(v) = 2</text>
<text x="280.0" y="350" font-size="24" font-weight="700" text-anchor="middle">(나) 눈금자 2df: 등고선이 두 배로 촘촘</text>
<line x1="40" y1="370" x2="40" y2="520" stroke="#a100c1" stroke-width="3"/>
<line x1="85" y1="370" x2="85" y2="520" stroke="#a100c1" stroke-width="3"/>
<line x1="130" y1="370" x2="130" y2="520" stroke="#a100c1" stroke-width="3"/>
<line x1="175" y1="370" x2="175" y2="520" stroke="#a100c1" stroke-width="3"/>
<line x1="220" y1="370" x2="220" y2="520" stroke="#a100c1" stroke-width="3"/>
<line x1="265" y1="370" x2="265" y2="520" stroke="#a100c1" stroke-width="3"/>
<line x1="310" y1="370" x2="310" y2="520" stroke="#a100c1" stroke-width="3"/>
<line x1="355" y1="370" x2="355" y2="520" stroke="#a100c1" stroke-width="3"/>
<line x1="400" y1="370" x2="400" y2="520" stroke="#a100c1" stroke-width="3"/>
<line x1="445" y1="370" x2="445" y2="520" stroke="#a100c1" stroke-width="3"/>
<line x1="490" y1="370" x2="490" y2="520" stroke="#a100c1" stroke-width="3"/>
<line x1="93.0" y1="445.0" x2="261.0" y2="445.0" stroke="#1f77b4" stroke-width="5"/><polygon points="255.3,454.4 273.0,445.0 255.3,435.6" fill="#1f77b4"/>
<text x="183" y="428" font-size="26" font-weight="700" fill="#1f77b4" text-anchor="middle">v</text>
<text x="280.0" y="582" font-size="22" text-anchor="middle">같은 v가 네 줄을 넘는다 → 4</text>
</g></svg>