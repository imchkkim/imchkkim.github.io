<line x1="220" y1="50" x2="220" y2="200" stroke="#a100c1" stroke-width="3"/>
<text x="220" y="228" font-size="21" text-anchor="middle" fill="#a100c1">2</text>
<line x1="310" y1="50" x2="310" y2="200" stroke="#a100c1" stroke-width="3"/>
<text x="310" y="228" font-size="21" text-anchor="middle" fill="#a100c1">3</text>
<line x1="400" y1="50" x2="400" y2="200" stroke="#a100c1" stroke-width="3"/>
<text x="400" y="228" font-size="21" text-anchor="middle" fill="#a100c1">4</text>
