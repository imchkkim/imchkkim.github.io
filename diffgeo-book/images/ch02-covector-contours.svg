<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" width="560" height="640"><rect width="560" height="640" fill="#fff"/><g font-family="'Noto Sans KR','Noto Sans CJK KR',sans-serif" fill="#111">
<text x="280.0" y="30" font-size="24" font-weight="700" text-anchor="middle">(가) 눈금자 df: 등고선 값이 1씩</text>
<line x1="40" y1="50" x2="40" y2="200" stroke="#a100c1" stroke-width="3"/>
<text x="40" y="228" font-size="21" text-anchor="middle" fill="#a100c1">0</text>
