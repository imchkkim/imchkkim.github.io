<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="Pretendard, 'Noto Sans KR', sans-serif">
<rect width="560" height="560" rx="10" fill="#fff"/>
<defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3c7b8b"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#966b40"/></marker></defs>
<text x="20" y="36" font-size="20" fill="#222" font-weight="700">앞으로 밀기: 값 둘이 한 자리에서 부딪힌다</text>
<ellipse cx="130" cy="146" rx="100" ry="70" fill="#eef7fb" stroke="#0098c7" stroke-width="2"/>
<ellipse cx="430" cy="146" rx="100" ry="70" fill="#eef7fb" stroke="#0098c7" stroke-width="2"/>
<text x="40" y="96" font-size="20"><tspan fill="#0098c7" font-style="italic">M</tspan></text><text x="510" y="96" font-size="20"><tspan fill="#0098c7" font-style="italic">N</tspan></text>
<circle cx="110" cy="118" r="7" fill="#222"/>
<text x="94" y="125" font-size="20" fill="#966b40" font-weight="700" text-anchor="end">2</text>
<line x1="120" y1="118" x2="415" y2="146" stroke="#3c7b8b" stroke-width="2.5" marker-end="url(#af)"/>
<circle cx="110" cy="176" r="7" fill="#222"/>
<text x="94" y="183" font-size="20" fill="#966b40" font-weight="700" text-anchor="end">5</text>
<line x1="120" y1="176" x2="415" y2="146" stroke="#3c7b8b" stroke-width="2.5" marker-end="url(#af)"/>
<circle cx="425" cy="146" r="7" fill="#222"/>
<text x="445" y="153" font-size="20" fill="#966b40" font-weight="700">?</text>
<text x="270" y="106" font-size="20" text-anchor="middle"><tspan fill="#3c7b8b" font-style="italic">f</tspan></text>
<text x="280" y="246" font-size="18" fill="#222" text-anchor="middle">2를 적을까, 5를 적을까? 정할 수 없다</text>
<text x="20" y="312" font-size="20" fill="#222" font-weight="700">뒤로 끌어오기: 한 값을 둘이 나눠 받는다</text>
<ellipse cx="130" cy="422" rx="100" ry="70" fill="#eef7fb" stroke="#0098c7" stroke-width="2"/>
<ellipse cx="430" cy="422" rx="100" ry="70" fill="#eef7fb" stroke="#0098c7" stroke-width="2"/>
<text x="40" y="372" font-size="20"><tspan fill="#0098c7" font-style="italic">M</tspan></text><text x="510" y="372" font-size="20"><tspan fill="#0098c7" font-style="italic">N</tspan></text>
<circle cx="110" cy="394" r="7" fill="#222"/>
<text x="94" y="401" font-size="20" fill="#966b40" font-weight="700" text-anchor="end">7</text>
<line x1="120" y1="394" x2="415" y2="422" stroke="#3c7b8b" stroke-width="2.5" marker-end="url(#af)"/>
<circle cx="110" cy="452" r="7" fill="#222"/>
<text x="94" y="459" font-size="20" fill="#966b40" font-weight="700" text-anchor="end">7</text>
<line x1="120" y1="452" x2="415" y2="422" stroke="#3c7b8b" stroke-width="2.5" marker-end="url(#af)"/>
<circle cx="425" cy="422" r="7" fill="#222"/>
<text x="445" y="429" font-size="20" fill="#966b40" font-weight="700">7</text>
<text x="270" y="382" font-size="20" text-anchor="middle"><tspan fill="#3c7b8b" font-style="italic">f</tspan></text>
<text x="280" y="522" font-size="18" fill="#222" text-anchor="middle">두 점 모두 저쪽 값 7을 읽어 온다</text>
</svg>