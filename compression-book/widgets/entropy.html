<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=STIX+Two+Text:ital,wght@1,500;1,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --ink:#1b2230; --muted:#5d6675; --rule:#dde2e9; --soft:#eef1f5;
  --ok:#1a7f37; --bad:#b42318; --fill:rgba(194,64,138,.12);
  --sans:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --math:'STIX Two Text','DejaVu Serif','Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#111419; --surface:#181c23; --ink:#e5e8ee; --muted:#98a1af; --rule:#2b313b; --soft:#20252e; --ok:#4cc26a; --bad:#f07167; --fill:rgba(194,64,138,.18); color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#111419; --surface:#181c23; --ink:#e5e8ee; --muted:#98a1af; --rule:#2b313b; --soft:#20252e; --ok:#4cc26a; --bad:#f07167; --fill:rgba(194,64,138,.18); color-scheme:dark; }
*{box-sizing:border-box}
body{word-break:keep-all;overflow-wrap:anywhere;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;margin:0;padding-inline:16px;padding-block:28px 56px}
main{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header h1{font-size:1.45rem;line-height:1.35;margin:0 0 6px;text-wrap:balance;font-weight:700}
header p{margin:0;color:var(--muted);max-width:65ch}
nav{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:.92rem}
nav a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
nav a:hover,nav a:focus-visible{border-bottom-color:var(--ink)}
section.w{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-family:var(--mono)}
section.w h2{font-size:1.15rem;margin:0;font-weight:700;text-wrap:balance}
.msg{margin:0;padding:10px 14px;background:var(--soft);border-radius:6px;font-weight:500}
.formula{font-family:var(--math);font-size:1.05rem;color:var(--ink);overflow-x:auto;white-space:nowrap}
.sym{font-family:var(--math);font-style:italic;font-weight:700}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 24px}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.92rem}
.ctl output{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.92rem}
input[type=range]{width:100%;margin:0}
input[type=range]:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.toggle{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:320px}
.chart .axis{stroke:var(--muted);stroke-width:1}
.chart .grid{stroke:var(--rule);stroke-width:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 20px;margin:0}
.stats div{display:flex;flex-direction:column;border-top:1px solid var(--rule);padding-top:6px}
.stats dt{font-size:.82rem;color:var(--muted)}
.stats dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.85rem;color:var(--muted)}
.legend > span{display:inline-flex;align-items:center;white-space:nowrap}
@media (max-width:560px){.legend > span{display:block;white-space:normal}} /* 휴대폰 폭: 긴 범례 줄이 위젯 밖으로 나가지 않게 */
.sw{display:inline-block;width:22px;height:0;border-top:3px solid;margin-right:7px}
.note{margin:0;font-size:.88rem;color:var(--muted)}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.presets button{font:inherit;font-size:.88rem;padding:5px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--soft);color:var(--ink);cursor:pointer}
.presets button:hover{border-color:var(--muted)}
.presets button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-family:var(--sans);font-size:.85rem;font-weight:700}
.pill.ok{color:var(--ok);border:1px solid var(--ok)}
.pill.bad{color:var(--bad);border:1px solid var(--bad)}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px 16px}
/* two-to-one row: plot + small drawing */
.duo2{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:8px 16px;align-items:center}
@media (max-width:560px){.duo2{grid-template-columns:1fr}}
footer{color:var(--muted);font-size:.85rem}
/* 이니그마 모조품(위젯 1) */
.enig{display:flex;flex-direction:column;gap:12px;outline:none}
.enig select,.enig input[type=text]{font:inherit;font-family:var(--mono);font-size:.9rem;padding:3px 6px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink)}
.setrow{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:.9rem}
.setrow > span{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.setrow input[type=text]{max-width:60vw}
.rotors{display:flex;gap:10px;justify-content:center;align-items:flex-end}
.rotor{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted)}
.rotor .win{font-family:var(--mono);font-size:1.5rem;font-weight:500;color:var(--ink);background:var(--soft);border:2px solid var(--rule);border-radius:6px;width:2.2em;text-align:center;line-height:1.5}
.rotor.moved .win{border-color:var(--muted)}
.board{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px;border-radius:10px;background:#20232a}
.board .row{display:flex;gap:5px}
.lamp{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.9rem;color:#6d7380;background:#2d313a;border:1px solid #3a3f4a;transition:background .08s}
.lamp.on{background:#ffd75e;color:#2a2000;box-shadow:0 0 14px #ffd75e;border-color:#ffd75e}
.keys{background:transparent;padding:0}
.key{width:34px;height:34px;border-radius:50%;font:inherit;font-family:var(--mono);font-size:.95rem;font-weight:500;border:2px solid var(--muted);background:var(--surface);color:var(--ink);cursor:pointer;padding:0}
.key:active,.key.down{background:var(--soft);transform:translateY(1px)}
.key:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:420px){.lamp{width:26px;height:26px;font-size:.8rem}.key{width:29px;height:29px;font-size:.85rem}.board .row,.keys .row{gap:3px}}
.tape{font-family:var(--mono);font-size:.92rem;letter-spacing:.04em;background:var(--soft);border-radius:6px;padding:6px 10px;min-height:2.1em;max-height:6.6em;overflow-y:auto;word-break:break-all;white-space:pre-wrap}
.tapes{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;font-size:.88rem}
.tapes > b{padding-top:6px;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.tabs button{font:inherit;font-size:.9rem;padding:4px 12px;border-radius:6px 6px 0 0;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--rule);background:var(--soft);font-weight:700}
.buddy{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:10px;padding:6px 12px 6px 6px}
.buddy img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface)}
.buddy p{margin:0;font-size:.9rem}
.buddy b.who{font-size:.8rem;color:var(--muted);display:block;font-weight:700}
.crib{font-family:var(--mono);font-size:.9rem;overflow-x:auto}
.crib .r{display:flex;white-space:nowrap}
.crib .c{width:1.25em;text-align:center;flex:none}
.crib .hit{background:var(--bad);color:#fff;border-radius:3px}
.crib .ok{color:var(--ok);font-weight:700}
.secret{border:2px dashed var(--muted);border-radius:8px;padding:8px 12px;font-size:.9rem}
/* 튜토리얼: 지금 단계의 조작부만 밝고(.spot 반짝 테두리) 나머지는 흐리게 잠근다(.locked) */
.locked{opacity:.3;pointer-events:none;filter:grayscale(.7)}
.spot{outline:3px solid #f2a900;outline-offset:3px;border-radius:8px;animation:spot 1.3s ease-in-out infinite}
.key.spot{border-radius:50%}
@keyframes spot{50%{outline-color:rgba(242,169,0,.25)}}
@media (prefers-reduced-motion: reduce){.spot{animation:none}}
.guide{display:flex;flex-direction:column;gap:6px;border:2px solid #f2a900;border-radius:12px;padding:8px}
.guide-head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.guide-head .pill{border:1px solid var(--muted)}
.guide-nav{display:flex;gap:6px}
.guide-nav button{font:inherit;font-size:.85rem;padding:3px 10px;border-radius:999px;border:1px solid var(--rule);background:var(--soft);color:var(--ink);cursor:pointer}
.guide-nav button:disabled{opacity:.4;cursor:default}
.modes button{font-size:.95rem}
/* 챌린지 */
.chal-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px}
.chal{display:flex;gap:8px;align-items:center;text-align:left;font:inherit;font-size:.88rem;padding:6px 10px;border-radius:8px;border:1px solid var(--rule);background:var(--soft);color:var(--ink);cursor:pointer}
.chal.on{border-color:var(--ink);font-weight:700}
.chal.done{border-color:var(--ok)}
.chal .pill{margin-left:auto}
.stars{color:#d89a00;letter-spacing:.05em;font-size:.85rem;white-space:nowrap}
.chal-card{display:flex;flex-direction:column;gap:8px;background:var(--soft);border-radius:10px;padding:10px 12px}
.chal-card .presets button{background:var(--surface)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
