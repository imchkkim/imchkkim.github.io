<text x="708.9" y="96.0" font-size="32" font-style="italic" font-family="serif" fill="#141413">y = φ(x)</text>
<text x="801.5" y="820" font-size="30" text-anchor="middle" fill="#141413" font-style="italic" font-family="serif">a</text>
<text x="122" y="550.0" font-size="30" text-anchor="end" fill="#141413" font-style="italic" font-family="serif">b</text>
<text x="122" y="790.0" font-size="28" text-anchor="end" fill="#5d6675">0</text>
<text x="166.5" y="607.2" font-size="28" fill="#bb5522" font-weight="700">곡선 왼쪽 넓이</text>
<text x="536.9" y="732.0" font-size="28" fill="#4363d8" font-weight="700">곡선 아래 넓이</text>
<text x="679.2" y="492.0" font-size="23" fill="#141413" font-weight="700">남는 조각</text>
<text x="1060" y="150" font-size="30" fill="#dd6677" font-weight="700">직사각형 ab (붉은 테)는</text>
<text x="1060" y="202" font-size="30" fill="#141413" font-weight="400">두 넓이를 합친 것에</text>
<text x="1060" y="254" font-size="30" fill="#141413" font-weight="400">늘 덮인다.</text>
<text x="1060" y="344" font-size="30" fill="#4363d8" font-weight="700">곡선 아래 넓이 = ∫₀ᵃ φ</text>
<text x="1060" y="396" font-size="30" fill="#bb5522" font-weight="700">곡선 왼쪽 넓이 = ∫₀ᵇ φ⁻¹</text>
<text x="1060" y="486" font-size="30" fill="#141413" font-weight="400">합이 ab보다 큰 만큼이</text>
<text x="1060" y="538" font-size="30" fill="#141413" font-weight="400">회색 남는 조각이고,</text>
<text x="1060" y="590" font-size="30" fill="#141413" font-weight="400">b = φ(a)일 때만 0이 된다.</text>
