<text x="1190" y="150" font-size="34" fill="#dd6677" font-weight="700">기울기 −1, 0, 1인 자</text>
<text x="1190" y="206" font-size="30" fill="#141413" font-weight="400">기울기 0인 자(실선)는</text>
<text x="1190" y="258" font-size="30" fill="#141413" font-weight="400">두 골짜기 바닥에 함께 걸린다.</text>
<text x="1190" y="310" font-size="30" fill="#141413" font-weight="400">기울기 ±1인 자(점선)는</text>
<text x="1190" y="362" font-size="30" fill="#141413" font-weight="400">x ≈ ±1.11에 걸린다.</text>
<text x="1190" y="456" font-size="34" fill="#141413" font-weight="700">봉우리에는</text>
<text x="1190" y="512" font-size="30" fill="#141413" font-weight="400">어떤 자도 닿지 않는다.</text>
<text x="1190" y="606" font-size="34" fill="#bb5522" font-weight="700">두 번 변환한 f**</text>
<text x="1190" y="662" font-size="30" fill="#141413" font-weight="400">(굵고 연한 선)</text>
<text x="1190" y="714" font-size="30" fill="#141413" font-weight="400">−1 ≤ x ≤ 1에서 높이 0</text>
