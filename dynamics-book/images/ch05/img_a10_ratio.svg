<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" font-family="'Noto Sans KR','Noto Sans CJK KR',sans-serif">
<rect width="1600" height="820" fill="#ffffff"/>
<line x1="150" x2="1000" y1="640" y2="640" stroke="#e6e8ec" stroke-width="2"/><text x="134" y="649" font-size="26" fill="#5d6675" text-anchor="end">0</text>
<line x1="150" x2="1000" y1="502.5" y2="502.5" stroke="#e6e8ec" stroke-width="2"/><text x="134" y="511.5" font-size="26" fill="#5d6675" text-anchor="end">0.25</text>
<line x1="150" x2="1000" y1="365.0" y2="365.0" stroke="#e6e8ec" stroke-width="2"/><text x="134" y="374.0" font-size="26" fill="#5d6675" text-anchor="end">0.5</text>
<line x1="150" x2="1000" y1="227.5" y2="227.5" stroke="#e6e8ec" stroke-width="2"/><text x="134" y="236.5" font-size="26" fill="#5d6675" text-anchor="end">0.75</text>
<line x1="150" x2="1000" y1="90" y2="90" stroke="#e6e8ec" stroke-width="2"/><text x="134" y="99" font-size="26" fill="#5d6675" text-anchor="end">1</text>
<line x1="150" x2="1000" y1="640" y2="640" stroke="#5d6675" stroke-width="2"/>
<rect x="242.5" y="200.0" width="110" height="440.0" fill="#e377c2"/>
<text x="297.5" y="186.0" font-size="30" font-weight="700" text-anchor="middle" fill="#141413">0.8</text>
<text x="297.5" y="680" font-size="30" font-style="italic" font-family="serif" font-weight="700" text-anchor="middle" fill="#e377c2">p</text>
<rect x="372.5" y="365.0" width="110" height="275.0" fill="#bcbd22"/>
<text x="427.5" y="351.0" font-size="30" font-weight="700" text-anchor="middle" fill="#141413">0.5</text>
<text x="427.5" y="680" font-size="30" font-style="italic" font-family="serif" font-weight="700" text-anchor="middle" fill="#bcbd22">q</text>
<text x="362.5" y="730" font-size="30" text-anchor="middle" fill="#141413">결과 1</text>
<text x="362.5" y="775" font-size="30" font-weight="700" text-anchor="middle" fill="#141413">비 0.8/0.5 = 1.6</text>
<rect x="667.5" y="530.0" width="110" height="110.0" fill="#e377c2"/>
<text x="722.5" y="516.0" font-size="30" font-weight="700" text-anchor="middle" fill="#141413">0.2</text>
<text x="722.5" y="680" font-size="30" font-style="italic" font-family="serif" font-weight="700" text-anchor="middle" fill="#e377c2">p</text>
<rect x="797.5" y="365.0" width="110" height="275.0" fill="#bcbd22"/>
<text x="852.5" y="351.0" font-size="30" font-weight="700" text-anchor="middle" fill="#141413">0.5</text>
<text x="852.5" y="680" font-size="30" font-style="italic" font-family="serif" font-weight="700" text-anchor="middle" fill="#bcbd22">q</text>
<text x="787.5" y="730" font-size="30" text-anchor="middle" fill="#141413">결과 2</text>
<text x="787.5" y="775" font-size="30" font-weight="700" text-anchor="middle" fill="#141413">비 0.2/0.5 = 0.4</text>
<text x="1060" y="150" font-size="34" fill="#9467bd" font-weight="700">KL의 두 항</text>
<text x="1060" y="208" font-size="30" fill="#141413" font-weight="400">0.8 × ln 1.6 = 0.3760</text>
<text x="1060" y="262" font-size="30" fill="#141413" font-weight="400">0.2 × ln 0.4 = −0.1833</text>
<text x="1060" y="316" font-size="30" fill="#141413" font-weight="700">합 KL = 0.1927</text>
<text x="1060" y="410" font-size="30" fill="#141413" font-weight="400">두 항 모두 확률의 비</text>
<text x="1060" y="464" font-size="30" fill="#141413" font-weight="400">1.6과 0.4가 있어야 계산된다.</text>
<text x="1060" y="518" font-size="30" fill="#141413" font-weight="400">샘플만 가진 사람은</text>
<text x="1060" y="572" font-size="30" fill="#141413" font-weight="400">바로 이 비를 모른다.</text>
</svg>