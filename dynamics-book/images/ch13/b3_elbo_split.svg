<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 272" width="560" height="272" role="img" aria-label="로그우도를 ELBO와 KL로 나눈 막대"><rect x="0" y="0" width="560" height="272" fill="#ffffff"/><text x="20.0" y="30.0" text-anchor="start" style="fill:#1f2430;font-family:'Noto Sans CJK KR','Pretendard',sans-serif;font-size:18px;font-weight:700">로그우도 = ELBO + KL</text><rect x="40.0" y="95" width="421.7" height="56" fill="#a000c8" fill-opacity="0.75"/><rect x="461.7" y="95" width="20.5" height="56" fill="#9467bd" fill-opacity="0.9"/><text x="250.8" y="129.0" text-anchor="middle" style="fill:#ffffff;font-family:'Noto Sans CJK KR','Pretendard',sans-serif;font-size:17px;font-weight:700">ELBO = −βF[q] = 2.108</text><line x1="482.2" x2="482.2" y1="65" y2="159" stroke="#667733" stroke-width="2.5" stroke-dasharray="6 4"/><text x="482.2" y="59.0" text-anchor="end" style="fill:#667733;font-family:'Noto Sans CJK KR','Pretendard',sans-serif;font-size:17px;font-weight:700">ln Z = 2.211</text><line x1="471.9" x2="471.9" y1="151" y2="191" stroke="#9467bd" stroke-width="1.6"/><text x="471.9" y="213.0" text-anchor="end" style="fill:#9467bd;font-family:'Noto Sans CJK KR','Pretendard',sans-serif;font-size:17px;font-weight:700">틈 D<tspan baseline-shift="sub" style="font-size:12px">KL</tspan>(q‖p) = 0.103</text><line x1="40.0" x2="40.0" y1="151" y2="157" stroke="#5d6675"/><text x="40.0" y="175.0" text-anchor="middle" style="fill:#5d6675;font-family:'Noto Sans CJK KR','Pretendard',sans-serif;font-size:14px;font-weight:400">0</text><line x1="140.0" x2="140.0" y1="151" y2="157" stroke="#5d6675"/><text x="140.0" y="175.0" text-anchor="middle" style="fill:#5d6675;font-family:'Noto Sans CJK KR','Pretendard',sans-serif;font-size:14px;font-weight:400">0.5</text><line x1="240.0" x2="240.0" y1="151" y2="157" stroke="#5d6675"/><text x="240.0" y="175.0" text-anchor="middle" style="fill:#5d6675;font-family:'Noto Sans CJK KR','Pretendard',sans-serif;font-size:14px;font-weight:400">1</text><line x1="340.0" x2="340.0" y1="151" y2="157" stroke="#5d6675"/><text x="340.0" y="175.0" text-anchor="middle" style="fill:#5d6675;font-family:'Noto Sans CJK KR','Pretendard',sans-serif;font-size:14px;font-weight:400">1.5</text><line x1="440.0" x2="440.0" y1="151" y2="157" stroke="#5d6675"/><text x="440.0" y="175.0" text-anchor="middle" style="fill:#5d6675;font-family:'Noto Sans CJK KR','Pretendard',sans-serif;font-size:14px;font-weight:400">2</text><text x="20.0" y="258.0" text-anchor="start" style="fill:#5d6675;font-family:'Noto Sans CJK KR','Pretendard',sans-serif;font-size:14px;font-weight:400">결합된 스핀 둘(βJ = 1, βb = 0.5)과 가장 나은 곱 분포. 단위 nat.</text></svg>
