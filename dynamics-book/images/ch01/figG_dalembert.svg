<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490" font-family="'Noto Sans KR','Noto Sans CJK KR',sans-serif">
<rect width="560" height="490" fill="#ffffff"/>
<text x="280.0" y="34.0" font-size="19" fill="#141413" text-anchor="middle" font-weight="700" >세 묶음에 1/3씩 준 풀이 (1754년 『백과전서』)</text>
<rect x="20.0" y="56" width="160" height="120" rx="10" fill="#f3f5f8" stroke="#17becf" stroke-width="3"/>
<text x="100.0" y="86.0" font-size="17" fill="#141413" text-anchor="middle" font-weight="400" >첫 번째에 앞면</text>
<circle cx="80.0" cy="122.0" r="15" fill="#17becf"/><text x="80.0" y="127.5" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >앞</text>
<text x="120.0" y="128.0" font-size="22" fill="#5d6675" text-anchor="middle" font-weight="400" >?</text>
<text x="100.0" y="164.0" font-size="19" fill="#141413" text-anchor="middle" font-weight="700" >1/3</text>
<rect x="200.0" y="56" width="160" height="120" rx="10" fill="#f3f5f8" stroke="#17becf" stroke-width="3"/>
<text x="280.0" y="86.0" font-size="17" fill="#141413" text-anchor="middle" font-weight="400" >뒤, 그다음 앞</text>
<circle cx="260.0" cy="122.0" r="14.2" fill="#fff" stroke="#5d6675" stroke-width="1.8"/><text x="260.0" y="127.5" font-size="15" fill="#5d6675" text-anchor="middle" font-weight="400" >뒤</text>
<circle cx="300.0" cy="122.0" r="15" fill="#17becf"/><text x="300.0" y="127.5" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >앞</text>
<text x="280.0" y="164.0" font-size="19" fill="#141413" text-anchor="middle" font-weight="700" >1/3</text>
<rect x="380.0" y="56" width="160" height="120" rx="10" fill="#f3f5f8" stroke="#d5d9e0" stroke-width="1.5"/>
<text x="460.0" y="86.0" font-size="17" fill="#141413" text-anchor="middle" font-weight="400" >뒤, 그다음 뒤</text>
<circle cx="440.0" cy="122.0" r="14.2" fill="#fff" stroke="#5d6675" stroke-width="1.8"/><text x="440.0" y="127.5" font-size="15" fill="#5d6675" text-anchor="middle" font-weight="400" >뒤</text>
<circle cx="480.0" cy="122.0" r="14.2" fill="#fff" stroke="#5d6675" stroke-width="1.8"/><text x="480.0" y="127.5" font-size="15" fill="#5d6675" text-anchor="middle" font-weight="400" >뒤</text>
<text x="460.0" y="164.0" font-size="19" fill="#141413" text-anchor="middle" font-weight="700" >1/3</text>
<text x="280.0" y="206.0" font-size="18" fill="#141413" text-anchor="middle" font-weight="700" >앞면이 한 번이라도: 1/3 + 1/3 = 2/3</text>
<line x1="20" x2="540" y1="226" y2="226" stroke="#d5d9e0" stroke-width="2"/>
<text x="280.0" y="260.0" font-size="19" fill="#141413" text-anchor="middle" font-weight="700" >네 경우를 모두 적은 풀이</text>
<rect x="27.0" y="324" width="116" height="92" rx="10" fill="#f3f5f8" stroke="#17becf" stroke-width="3"/>
<circle cx="66.0" cy="358.0" r="15" fill="#17becf"/><text x="66.0" y="363.5" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >앞</text>
<circle cx="104.0" cy="358.0" r="15" fill="#17becf"/><text x="104.0" y="363.5" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >앞</text>
<text x="85.0" y="402.0" font-size="19" fill="#141413" text-anchor="middle" font-weight="700" >1/4</text>
<rect x="157.0" y="324" width="116" height="92" rx="10" fill="#f3f5f8" stroke="#17becf" stroke-width="3"/>
<circle cx="196.0" cy="358.0" r="15" fill="#17becf"/><text x="196.0" y="363.5" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >앞</text>
<circle cx="234.0" cy="358.0" r="14.2" fill="#fff" stroke="#5d6675" stroke-width="1.8"/><text x="234.0" y="363.5" font-size="15" fill="#5d6675" text-anchor="middle" font-weight="400" >뒤</text>
<text x="215.0" y="402.0" font-size="19" fill="#141413" text-anchor="middle" font-weight="700" >1/4</text>
<rect x="287.0" y="324" width="116" height="92" rx="10" fill="#f3f5f8" stroke="#17becf" stroke-width="3"/>
<circle cx="326.0" cy="358.0" r="14.2" fill="#fff" stroke="#5d6675" stroke-width="1.8"/><text x="326.0" y="363.5" font-size="15" fill="#5d6675" text-anchor="middle" font-weight="400" >뒤</text>
<circle cx="364.0" cy="358.0" r="15" fill="#17becf"/><text x="364.0" y="363.5" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >앞</text>
<text x="345.0" y="402.0" font-size="19" fill="#141413" text-anchor="middle" font-weight="700" >1/4</text>
<rect x="417.0" y="324" width="116" height="92" rx="10" fill="#f3f5f8" stroke="#d5d9e0" stroke-width="1.5"/>
<circle cx="456.0" cy="358.0" r="14.2" fill="#fff" stroke="#5d6675" stroke-width="1.8"/><text x="456.0" y="363.5" font-size="15" fill="#5d6675" text-anchor="middle" font-weight="400" >뒤</text>
<circle cx="494.0" cy="358.0" r="14.2" fill="#fff" stroke="#5d6675" stroke-width="1.8"/><text x="494.0" y="363.5" font-size="15" fill="#5d6675" text-anchor="middle" font-weight="400" >뒤</text>
<text x="475.0" y="402.0" font-size="19" fill="#141413" text-anchor="middle" font-weight="700" >1/4</text>
<path d="M27.0 316 L27.0 306 L273.0 306 L273.0 316" fill="none" stroke="#141413" stroke-width="2"/>
<text x="150.0" y="298.0" font-size="16" fill="#5d6675" text-anchor="middle" font-weight="400" >「첫 번째에 앞면」 안의 두 경우</text>
<text x="280.0" y="452.0" font-size="18" fill="#141413" text-anchor="middle" font-weight="700" >앞면이 한 번이라도: 1/4 + 1/4 + 1/4 = 3/4</text>
<text x="280.0" y="478.0" font-size="15" fill="#5d6675" text-anchor="middle" font-weight="400" >테두리가 굵은 것 = 앞면이 한 번이라도 나온 경우</text>
</svg>