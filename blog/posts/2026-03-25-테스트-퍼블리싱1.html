<style>/* lameproof 블로그 — 교재와 같은 색 토큰을 쓴다 (테마 키도 'theme' 로 공유) */
:root {
  --bg: #ffffff;
  --bg-code: #f5f5f5;
  --fg: #1a1a1a;
  --fg-dim: #666;
  --accent: #1565C0;
  --border: #e0e0e0;
  --card: #fafafa;
}
[data-theme="dark"] {
  --bg: #1a1a2e;
  --bg-code: #16213e;
  --fg: #e0e0e0;
  --fg-dim: #9aa0b0;
  --accent: #64b5f6;
  --border: #2c3350;
  --card: #16213e;
}

* { box-sizing: border-box; }
body {
  margin: 0 auto;
  padding: 2.5rem 1.25rem 4rem;
  max-width: 44rem;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
  font-size: 1.05rem;
  line-height: 1.75;
  color: var(--fg);
  background: var(--bg);
  word-break: keep-all;
  overflow-wrap: break-word;
}

#theme-toggle {
  position: fixed; top: 1rem; right: 1rem; z-index: 100;
  background: none; border: 1px solid var(--border); border-radius: .5rem;
  padding: .4rem .6rem; font-size: 1.2rem; line-height: 1; cursor: pointer;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.site-nav { margin-bottom: 2rem; font-size: .9rem; }
.site-nav a { color: var(--fg-dim); }

h1 { font-size: 1.9rem; line-height: 1.35; margin: 0 0 .4rem; }
h2 { font-size: 1.4rem; margin: 2.2rem 0 .8rem; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
h3 { font-size: 1.15rem; margin: 1.8rem 0 .6rem; }

.post-meta { color: var(--fg-dim); font-size: .875rem; margin-bottom: 2.5rem; }
.tag {
  display: inline-block; margin-left: .4rem; padding: .1rem .5rem;
  border: 1px solid var(--border); border-radius: 1rem; font-size: .78rem;
}

/* 목록 페이지 */
.post-list { list-style: none; padding: 0; margin: 0; }
.post-list li {
  padding: 1.1rem 1.25rem; margin-bottom: .75rem;
  background: var(--card); border: 1px solid var(--border); border-radius: .5rem;
}
.post-list h2 { font-size: 1.2rem; margin: 0 0 .25rem; border: none; padding: 0; }
.post-list time { color: var(--fg-dim); font-size: .85rem; }

img { max-width: 100%; height: auto; display: block; margin: 1.5em auto; border-radius: 6px; }
blockquote { margin: 1.5em 0; padding: .3em 1.2em; border-left: 4px solid var(--accent); color: var(--fg-dim); }
code { background: var(--bg-code); padding: .15em .4em; border-radius: 4px; font-size: .9em; }
pre { background: var(--bg-code); padding: 1em; border-radius: 6px; overflow-x: auto; }
pre code { background: none; padding: 0; }
table { border-collapse: collapse; width: 100%; margin: 1.5em 0; display: block; overflow-x: auto; }
th, td { border: 1px solid var(--border); padding: .5em .75em; text-align: left; }
hr { border: none; border-top: 1px solid var(--border); margin: 2.5em 0; }
.katex-display { overflow-x: auto; overflow-y: hidden; padding: .2em 0; }
footer { margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid var(--border); color: var(--fg-dim); font-size: .85rem; }
</style>
<script>
(function(){var s=localStorage.getItem('theme');if(s==='dark'||(!s&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark')})();
</script>
</head>
<body>
<button id="theme-toggle" aria-label="다크모드 전환">&#x1F319;</button>
<nav class="site-nav"><a href="../index.html">&larr; Blog</a></nav>

<script>
const toggle = document.getElementById('theme-toggle');
if (document.documentElement.getAttribute('data-theme') === 'dark') toggle.textContent = '\u2600\uFE0F';
toggle.addEventListener('click', () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
  toggle.textContent = isDark ? '\u{1F319}' : '\u2600\uFE0F';
});
</script>
