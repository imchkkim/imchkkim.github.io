<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" font-family="'Noto Sans KR', sans-serif">
<rect width="560" height="200" fill="#ffffff"/>
<text x="280.0" y="26.0" fill="#111111" font-size="15" text-anchor="middle" font-weight="700">같은 60 km, 갈 때와 올 때의 속력이 다른 왕복</text>
<line x1="90" y1="110" x2="470" y2="110" stroke="#555555" stroke-width="6" stroke-linecap="round"/>
<circle cx="90" cy="110" r="9" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
<text x="90.0" y="142.0" fill="#111111" font-size="13" text-anchor="middle" font-weight="400">출발 도시</text>
<circle cx="470" cy="110" r="9" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
<text x="470.0" y="142.0" fill="#111111" font-size="13" text-anchor="middle" font-weight="400">도착 도시</text>
<text x="280.0" y="142.0" fill="#555555" font-size="13" text-anchor="middle" font-weight="400">60 km</text>
<line x1="110" y1="80" x2="450" y2="80" stroke="#111111" stroke-width="2.5"/>
<polygon points="450.0,80.0 440.0,85.0 440.0,75.0" fill="#111111"/>
<text x="280.0" y="70.0" fill="#111111" font-size="13" text-anchor="middle" font-weight="400">갈 때 시속 30 km (길이 막힘)</text>
<line x1="450" y1="168" x2="110" y2="168" stroke="#111111" stroke-width="2.5"/>
<polygon points="110.0,168.0 120.0,163.0 120.0,173.0" fill="#111111"/>
<text x="280.0" y="190.0" fill="#111111" font-size="13" text-anchor="middle" font-weight="400">올 때 시속 90 km</text>
</svg>
