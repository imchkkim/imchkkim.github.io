<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" font-family="'Noto Sans KR', sans-serif">
  <defs>
    <linearGradient id="bg1c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f5f6"/><stop offset="100%" stop-color="#eeeff1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="190" fill="url(#bg1c)" rx="10"/>
  <!-- 공정한 동전: 앞면 0.5, 뒷면 0.5 -->
  <g transform="translate(78,82)">
    <ellipse cx="0" cy="0" rx="46" ry="46" fill="#ca8208" fill-opacity="0.15" stroke="#ca8208" stroke-width="1.5"/>
    <text x="0" y="-6" fill="#e7a804" font-size="17" text-anchor="middle" font-weight="700">앞 0.5</text>
    <text x="0" y="18" fill="#e7a804" font-size="15" text-anchor="middle">뒤 0.5</text>
    <text x="0" y="74" fill="#1e2834" font-size="15" text-anchor="middle">공정한 동전</text>
  </g>
  <!-- 얼마나 다른가 -->
  <g>
    <line x1="134" y1="82" x2="266" y2="82" stroke="#6222f3" stroke-width="1.5" stroke-dasharray="6 4"/>
    <polygon points="266,82 258,78 258,86" fill="#6222f3"/>
    <polygon points="134,82 142,78 142,86" fill="#6222f3"/>
    <text x="200" y="70" fill="#11024a" font-size="15" text-anchor="middle">얼마나 다른가?</text>
  </g>
  <!-- 기운 동전: 앞면 0.7, 뒷면 0.3 -->
  <g transform="translate(322,82)">
    <ellipse cx="0" cy="0" rx="46" ry="46" fill="#0b62ef" fill-opacity="0.15" stroke="#0b62ef" stroke-width="1.5"/>
    <text x="0" y="-6" fill="#2483f8" font-size="17" text-anchor="middle" font-weight="700">앞 0.7</text>
    <text x="0" y="18" fill="#2483f8" font-size="15" text-anchor="middle">뒤 0.3</text>
    <text x="0" y="74" fill="#1e2834" font-size="15" text-anchor="middle">기운 동전</text>
  </g>
</svg>
