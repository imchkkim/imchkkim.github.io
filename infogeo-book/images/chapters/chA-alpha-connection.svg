<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" font-family="'Noto Sans KR', sans-serif">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f5f6"/>
      <stop offset="100%" stop-color="#eeeff1"/>
    </linearGradient>
    <linearGradient id="axisGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e81414"/>
      <stop offset="50%" stop-color="#ca8208"/>
      <stop offset="100%" stop-color="#0b62ef"/>
    </linearGradient>
  </defs>

  <rect width="480" height="180" fill="url(#bgA)" rx="12"/>
  <text x="240" y="28" fill="#0f151d" font-size="14" text-anchor="middle" font-weight="600">α-접속의 연속체</text>

  <!-- Main axis -->
  <line x1="60" y1="90" x2="420" y2="90" stroke="url(#axisGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Tick marks and labels -->
  <!-- α = -1 (m-connection) -->
  <line x1="90" y1="80" x2="90" y2="100" stroke="#e81414" stroke-width="2"/>
  <circle cx="90" cy="90" r="6" fill="#e81414"/>
  <text x="90" y="70" fill="#e81414" font-size="11" text-anchor="middle" font-weight="600">α = −1</text>
  <text x="90" y="118" fill="#8e0707" font-size="9" text-anchor="middle">m-접속</text>
  <text x="90" y="132" fill="#7084a0" font-size="8" text-anchor="middle">(혼합의 길)</text>

  <!-- α = 0 (Levi-Civita) -->
  <line x1="240" y1="80" x2="240" y2="100" stroke="#ca8208" stroke-width="2"/>
  <circle cx="240" cy="90" r="6" fill="#ca8208"/>
  <text x="240" y="70" fill="#ca8208" font-size="11" text-anchor="middle" font-weight="600">α = 0</text>
  <text x="240" y="118" fill="#e7a804" font-size="9" text-anchor="middle">Levi-Civita</text>
  <text x="240" y="132" fill="#7084a0" font-size="8" text-anchor="middle">(리만 측지선)</text>

  <!-- α = +1 (e-connection) -->
  <line x1="390" y1="80" x2="390" y2="100" stroke="#0b62ef" stroke-width="2"/>
  <circle cx="390" cy="90" r="6" fill="#0b62ef"/>
  <text x="390" y="70" fill="#0b62ef" font-size="11" text-anchor="middle" font-weight="600">α = +1</text>
  <text x="390" y="118" fill="#2483f8" font-size="9" text-anchor="middle">e-접속</text>
  <text x="390" y="132" fill="#7084a0" font-size="8" text-anchor="middle">(지수의 길)</text>

  <!-- Duality arrow -->
  <path d="M 110 150 Q 240 165, 370 150" stroke="#6222f3" stroke-width="1" fill="none" stroke-dasharray="4 3"/>
  <text x="240" y="168" fill="#210574" font-size="9" text-anchor="middle">쌍대: ∇⁽⁻¹⁾ ↔ ∇⁽⁺¹⁾</text>

  <!-- Arrow tips on main axis -->
  <polygon points="420,90 412,84 412,96" fill="#0b62ef" opacity="0.7"/>
  <polygon points="60,90 68,84 68,96" fill="#e81414" opacity="0.7"/>
</svg>
