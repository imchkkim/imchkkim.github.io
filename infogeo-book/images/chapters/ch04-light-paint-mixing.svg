<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 440" font-family="'Noto Sans KR', sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <clipPath id="c4l"><circle cx="165" cy="105" r="62"/></clipPath>
    <clipPath id="c4f"><circle cx="165" cy="325" r="62"/></clipPath>
  </defs>
  <rect width="500" height="440" fill="url(#bg4)" rx="10"/>
  <!-- 위: 빛을 더한다 (빨강 + 초록 = 노랑) -->
  <circle cx="95" cy="105" r="62" fill="#ef4444"/>
  <circle cx="165" cy="105" r="62" fill="#22c55e"/>
  <circle cx="95" cy="105" r="62" fill="#facc15" clip-path="url(#c4l)"/>
  <g fill="#0f172a" font-size="16" text-anchor="middle" font-weight="600"><text x="72" y="110">빨강</text><text x="190" y="110">초록</text><text x="130" y="110">노랑</text></g>
  <g fill="#e2e8f0"><text x="252" y="62" font-size="21" font-weight="700" fill="#fbbf24">빛을 더한다</text><text x="252" y="96" font-size="17">파장마다 밝기가 더해진다</text><text x="252" y="126" font-size="17">한쪽 빛만 닿아도 밝다</text><text x="252" y="156" font-size="17" fill="#fbbf24">OR</text></g>
  <line x1="20" y1="215" x2="480" y2="215" stroke="#334155" stroke-width="1"/>
  <!-- 아래: 흰 빛 앞에 필터를 겹친다 (노랑 × 시안 = 초록) -->
  <rect x="18" y="248" width="224" height="154" rx="8" fill="#f1f5f9"/>
  <text x="130" y="425" font-size="15" fill="#94a3b8" text-anchor="middle">뒤에서 흰 빛을 비춘다</text>
  <circle cx="95" cy="325" r="62" fill="#fde047"/>
  <circle cx="165" cy="325" r="62" fill="#67e8f9"/>
  <circle cx="95" cy="325" r="62" fill="#16a34a" clip-path="url(#c4f)"/>
  <g fill="#0f172a" font-size="16" text-anchor="middle" font-weight="600"><text x="70" y="330">노랑</text><text x="192" y="330">시안</text><text x="130" y="330" fill="#f8fafc">초록</text></g>
  <g fill="#e2e8f0"><text x="252" y="272" font-size="21" font-weight="700" fill="#4ade80">필터를 겹친다</text><text x="252" y="306" font-size="17">파장마다 통과율이 곱해진다</text><text x="252" y="336" font-size="17">0.8 × 0.3 = 0.24</text><text x="252" y="366" font-size="17">둘 다 통과시켜야 남는다</text><text x="252" y="396" font-size="17" fill="#4ade80">AND</text></g>
</svg>
