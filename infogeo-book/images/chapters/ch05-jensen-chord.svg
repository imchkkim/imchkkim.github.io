<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" font-family="'Noto Sans KR', sans-serif">
  <defs>
    <linearGradient id="bg5j" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="440" height="270" fill="url(#bg5j)" rx="10"/>
  <!-- 좌표: x 0..3 → 50..410 (120px/단위), y = 0 → 152.9 (55.88px/단위) -->
  <g stroke="#334155" stroke-width="1">
    <line x1="50" y1="152.9" x2="410" y2="152.9"/>
    <line x1="50" y1="30" x2="50" y2="222"/>
  </g>
  <g font-size="11" fill="#94a3b8" text-anchor="middle">
    <text x="170" y="167">1</text><text x="290" y="167">2</text><text x="404" y="167">3</text>
    <text x="42" y="157" text-anchor="end">0</text>
    <text x="418" y="150">x</text>
  </g>
  <!-- y = −log x -->
  <path d="M 66.8 43.0 L 72.5 59.4 L 78.2 72.1 L 84.0 82.4 L 89.7 91.1 L 95.4 98.6 L 101.1 105.2 L 106.8 111.1 L 112.6 116.5 L 118.3 121.4 L 124.0 125.9 L 129.7 130.0 L 135.4 133.9 L 141.2 137.5 L 146.9 140.9 L 152.6 144.1 L 158.3 147.2 L 164.0 150.1 L 169.8 152.8 L 175.5 155.4 L 181.2 157.9 L 186.9 160.3 L 192.6 162.6 L 198.4 164.8 L 204.1 166.9 L 209.8 168.9 L 215.5 170.9 L 221.2 172.8 L 227.0 174.6 L 232.7 176.4 L 238.4 178.1 L 244.1 179.8 L 249.8 181.4 L 255.6 183.0 L 261.3 184.5 L 267.0 186.0 L 272.7 187.5 L 278.4 188.9 L 284.2 190.3 L 289.9 191.6 L 295.6 192.9 L 301.3 194.2 L 307.0 195.5 L 312.8 196.7 L 318.5 197.9 L 324.2 199.1 L 329.9 200.2 L 335.6 201.4 L 341.4 202.5 L 347.1 203.6 L 352.8 204.6 L 358.5 205.7 L 364.2 206.7 L 370.0 207.7 L 375.7 208.7 L 381.4 209.7 L 387.1 210.6 L 392.8 211.6 L 398.6 212.5 L 404.3 213.4 L 410.0 214.3" fill="none" stroke="#e2e8f0" stroke-width="2.2"/>
  <text x="80" y="36" font-size="12" fill="#e2e8f0">y = −log x</text>
  <!-- 두 점 A(0.5, 0.693), B(2, −0.693)과 선분 -->
  <line x1="110" y1="114.2" x2="290" y2="191.6" stroke="#d6479f" stroke-width="1.6" stroke-dasharray="5 4"/>
  <circle cx="110" cy="114.2" r="6" fill="#d6479f"/>
  <circle cx="290" cy="191.6" r="6" fill="#d6479f"/>
  <!-- 무게중심 x = 1.25: 선분 위 높이 0, 곡선 높이 −0.223 -->
  <line x1="200" y1="152.9" x2="200" y2="165.4" stroke="#c2398a" stroke-width="3"/>
  <circle cx="200" cy="152.9" r="5.5" fill="#ffffff" stroke="#d6479f" stroke-width="2"/>
  <circle cx="200" cy="165.4" r="4" fill="#e2e8f0"/>
  <g font-size="13" fill="#cbd5e1">
    <text x="118" y="102">점 A (x = 0.5), 무게 ½</text>
    <text x="236" y="226">점 B (x = 2), 무게 ½</text>
    <text x="210" y="140">무게중심: 선분 위, 높이 0</text>
    <text x="192" y="190" text-anchor="end">곡선: −log 1.25 ≈ −0.22</text>
  </g>
  <text x="220" y="254" font-size="13.5" text-anchor="middle" fill="#e2e8f0">볼록한 곡선에서는 무게중심이 늘 곡선보다 위에 있다</text>
</svg>
