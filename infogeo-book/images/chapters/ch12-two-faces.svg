<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="'Noto Sans KR', sans-serif">
  <defs>
    <linearGradient id="bg12f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f5f6"/><stop offset="100%" stop-color="#eeeff1"/>
    </linearGradient>
    <marker id="ar12f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9f2f71"/>
    </marker>
  </defs>
  <rect width="480" height="360" fill="url(#bg12f)" rx="10"/>
  <!-- 데이터 면 D (위) -->
  <polygon points="90,40 450,40 384,140 24,140" fill="#704855" fill-opacity="0.28" stroke="#995b70" stroke-width="2"/>
  <text x="104" y="66" font-size="16" fill="#471d2b" font-weight="600">데이터 면 𝒟</text>
  <text x="104" y="88" font-size="14" fill="#1e2834">지워진 칸을 채운 출석부들</text>
  <text x="104" y="108" font-size="14" fill="#1e2834">이름(x)만 보면 모두</text>
  <text x="104" y="126" font-size="14" fill="#1e2834">받은 출석부 p̂ 와 같다</text>
  <circle cx="370" cy="76" r="7" fill="#68750d"/>
  <text x="384" y="82" font-size="17" fill="#869422">q</text>
  <!-- 모델 면 M (아래) -->
  <polygon points="90,214 450,214 390,310 30,310" fill="#345c42" fill-opacity="0.30" stroke="#4e7e5f" stroke-width="2"/>
  <text x="104" y="250" font-size="16" fill="#2a5737" font-weight="600">모델 면 M</text>
  <text x="104" y="272" font-size="14" fill="#1e2834">모델이 내놓는 결합분포 p<tspan baseline-shift="sub" font-size="11">θ</tspan>(x, z)</text>
  <text x="104" y="292" font-size="14" fill="#1e2834">(가우시안 혼합이면 혼합 비중·평균·폭)</text>
  <circle cx="370" cy="256" r="7" fill="#68750d"/>
  <text x="384" y="262" font-size="17" fill="#869422">p<tspan baseline-shift="sub" font-size="12">θ</tspan></text>
  <!-- KL 화살표 -->
  <line x1="370" y1="86" x2="370" y2="244" stroke="#9f2f71" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ar12f)"/>
  <text x="356" y="178" font-size="15" fill="#df439d" text-anchor="end">𝓛(q, θ) = KL(q ‖ p<tspan baseline-shift="sub" font-size="11">θ</tspan>)</text>
  <text x="356" y="198" font-size="13" fill="#7084a0" text-anchor="end">두 면 사이의 KL 이 목적함수</text>
  <text x="240" y="342" font-size="13" fill="#7084a0" text-anchor="middle">무대: (x, z) 결합분포들이 사는 공간</text>
</svg>
