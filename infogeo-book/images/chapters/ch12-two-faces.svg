<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="'Noto Sans KR', sans-serif">
  <defs>
    <linearGradient id="bg12f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="ar12f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2398a"/>
    </marker>
  </defs>
  <rect width="480" height="360" fill="url(#bg12f)" rx="10"/>
  <!-- 데이터 면 D (위) -->
  <polygon points="90,40 450,40 384,140 24,140" fill="#885868" fill-opacity="0.28" stroke="#b07a8c" stroke-width="2"/>
  <text x="104" y="66" font-size="16" fill="#e2b8c6" font-weight="600">데이터 면 𝒟</text>
  <text x="104" y="88" font-size="14" fill="#cbd5e1">지워진 칸을 채운 출석부들</text>
  <text x="104" y="108" font-size="14" fill="#cbd5e1">이름(x)만 보면 모두</text>
  <text x="104" y="126" font-size="14" fill="#cbd5e1">받은 출석부 p̂ 와 같다</text>
  <circle cx="370" cy="76" r="7" fill="#7f8f10"/>
  <text x="384" y="82" font-size="17" fill="#a3b52a">q</text>
  <!-- 모형 면 M (아래) -->
  <polygon points="90,214 450,214 390,310 30,310" fill="#407050" fill-opacity="0.30" stroke="#5f9a74" stroke-width="2"/>
  <text x="104" y="250" font-size="16" fill="#a8d5b5" font-weight="600">모형 면 M</text>
  <text x="104" y="272" font-size="14" fill="#cbd5e1">모형이 내놓는 결합분포 p<tspan baseline-shift="sub" font-size="11">θ</tspan>(x, z)</text>
  <text x="104" y="292" font-size="14" fill="#cbd5e1">(혼합 가우시안이면 혼합 비중·평균·폭)</text>
  <circle cx="370" cy="256" r="7" fill="#7f8f10"/>
  <text x="384" y="262" font-size="17" fill="#a3b52a">p<tspan baseline-shift="sub" font-size="12">θ</tspan></text>
  <!-- KL 화살표 -->
  <line x1="370" y1="86" x2="370" y2="244" stroke="#c2398a" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ar12f)"/>
  <text x="356" y="178" font-size="15" fill="#e879b9" text-anchor="end">𝓛(q, θ) = KL(q ‖ p<tspan baseline-shift="sub" font-size="11">θ</tspan>)</text>
  <text x="356" y="198" font-size="13" fill="#94a3b8" text-anchor="end">두 면 사이의 KL 이 목적함수</text>
  <text x="240" y="342" font-size="13" fill="#94a3b8" text-anchor="middle">무대: (x, z) 결합분포들이 사는 공간</text>
</svg>
