<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker><marker id="arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d07a12"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0068c0"/></marker><marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0892a"/></marker><marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect width="600" height="260" fill="#ffffff"/>
<rect x="40.0" y="40.0" width="200.0" height="70.0" fill="#ffffff" stroke="#d07a12" stroke-width="2"/>
<text x="140.0" y="70.0" fill="#111111" font-size="15" text-anchor="middle" font-weight="700">속도장 <tspan fill="#d07a12" font-style="italic">v</tspan>(y, <tspan fill="#007800" font-style="italic">t</tspan>)</text>
<text x="140.0" y="94.0" fill="#666666" font-size="12" text-anchor="middle" font-weight="400">플로우 매칭이 배운다</text>
<rect x="360.0" y="40.0" width="200.0" height="70.0" fill="#ffffff" stroke="#b0892a" stroke-width="2"/>
<text x="460.0" y="70.0" fill="#111111" font-size="15" text-anchor="middle" font-weight="700">스코어 <tspan fill="#b0892a" font-style="italic">∇log p</tspan><tspan baseline-shift='sub' font-size='11' fill='#b0892a'>t</tspan>(y)</text>
<text x="460.0" y="94.0" fill="#666666" font-size="12" text-anchor="middle" font-weight="400">디퓨전이 배운다</text>
<line x1="245.0" y1="75.0" x2="355.0" y2="75.0" stroke="#111111" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="355.0" y1="75.0" x2="245.0" y2="75.0" stroke="#111111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="300.0" y="66.0" fill="#111111" font-size="18" text-anchor="middle" font-weight="700">?</text>
<line x1="80.0" y1="190.0" x2="520.0" y2="190.0" stroke="#111111" stroke-width="1.2"/>
<line x1="80.0" y1="185.0" x2="80.0" y2="195.0" stroke="#111111" stroke-width="1.2"/>
<text x="80.0" y="212.0" fill="#111111" font-size="12" text-anchor="middle" font-weight="400"><tspan fill="#007800" font-style="italic">t</tspan> = 0</text>
<line x1="300.0" y1="185.0" x2="300.0" y2="195.0" stroke="#111111" stroke-width="1.2"/>
<text x="300.0" y="212.0" fill="#111111" font-size="12" text-anchor="middle" font-weight="400"><tspan fill="#007800" font-style="italic">t</tspan> = 0.5</text>
<line x1="520.0" y1="185.0" x2="520.0" y2="195.0" stroke="#111111" stroke-width="1.2"/>
<text x="520.0" y="212.0" fill="#111111" font-size="12" text-anchor="middle" font-weight="400"><tspan fill="#007800" font-style="italic">t</tspan> = 1</text>
<text x="80.0" y="176.0" fill="#111111" font-size="12" text-anchor="middle" font-weight="400">노이즈 <tspan fill="#8a7fb0" font-style="italic">z</tspan></text>
<text x="520.0" y="176.0" fill="#111111" font-size="12" text-anchor="middle" font-weight="400">데이터 <tspan fill="#6f8fa6" font-style="italic">x</tspan></text>
<text x="300.0" y="176.0" fill="#111111" font-size="13" text-anchor="middle" font-weight="400"><tspan fill="#6f8fa6" font-style="italic">x</tspan><tspan baseline-shift='sub' font-size='10'>t</tspan> = (1 − <tspan fill="#007800" font-style="italic">t</tspan>)<tspan fill="#8a7fb0" font-style="italic">z</tspan> + <tspan fill="#007800" font-style="italic">t</tspan><tspan fill="#6f8fa6" font-style="italic">x</tspan></text>
<text x="84.0" y="236.0" fill="#666666" font-size="12" text-anchor="start" font-weight="400">(나) 이 끝에서 다리 식은?</text>
<line x1="120.0" y1="224.0" x2="84.0" y2="198.0" stroke="#666666" stroke-width="1" marker-end="url(#arD)"/>
</svg>