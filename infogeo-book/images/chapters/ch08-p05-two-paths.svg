<text x="445.0" y="238.0" fill="#1f2328" font-size="12" text-anchor="middle" font-weight="700">B = N(2, 1²)</text>
<text x="290.0" y="22.0" fill="#1f2328" font-size="14" text-anchor="middle" font-weight="700">피셔 계량 ds² = (dμ² + 2dσ²)/σ² 으로 길이를 잴 두 길</text>
