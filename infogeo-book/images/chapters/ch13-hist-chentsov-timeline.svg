<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<rect width="700" height="360" fill="#ffffff"/>
<text x="350.0" y="30.0" fill="#1f2328" font-size="16" text-anchor="middle" font-weight="700">유한 개의 결과에서 무한히 많은 결과까지, 40년 넘게</text>
<line x1="105.5" y1="60.0" x2="105.5" y2="315.0" stroke="#c9ced6" stroke-width="0.8" stroke-dasharray="2 4"/>
<text x="105.5" y="335.0" fill="#5b6470" font-size="12" text-anchor="middle" font-weight="400">1970</text>
<line x1="216.4" y1="60.0" x2="216.4" y2="315.0" stroke="#c9ced6" stroke-width="0.8" stroke-dasharray="2 4"/>
<text x="216.4" y="335.0" fill="#5b6470" font-size="12" text-anchor="middle" font-weight="400">1980</text>
<line x1="327.3" y1="60.0" x2="327.3" y2="315.0" stroke="#c9ced6" stroke-width="0.8" stroke-dasharray="2 4"/>
<text x="327.3" y="335.0" fill="#5b6470" font-size="12" text-anchor="middle" font-weight="400">1990</text>
<line x1="438.2" y1="60.0" x2="438.2" y2="315.0" stroke="#c9ced6" stroke-width="0.8" stroke-dasharray="2 4"/>
<text x="438.2" y="335.0" fill="#5b6470" font-size="12" text-anchor="middle" font-weight="400">2000</text>
<line x1="549.1" y1="60.0" x2="549.1" y2="315.0" stroke="#c9ced6" stroke-width="0.8" stroke-dasharray="2 4"/>
<text x="549.1" y="335.0" fill="#5b6470" font-size="12" text-anchor="middle" font-weight="400">2010</text>
<line x1="660.0" y1="60.0" x2="660.0" y2="315.0" stroke="#c9ced6" stroke-width="0.8" stroke-dasharray="2 4"/>
<text x="660.0" y="335.0" fill="#5b6470" font-size="12" text-anchor="middle" font-weight="400">2020</text>
<line x1="50.0" y1="315.0" x2="660.0" y2="315.0" stroke="#1f2328" stroke-width="1.2"/>
<text x="50.0" y="72.0" fill="#1f2328" font-size="13" text-anchor="start" font-weight="700">결과가 유한 개 → 무한히 많은 표본 공간</text>
<line x1="50.0" y1="150.0" x2="660.0" y2="150.0" stroke="#c9ced6" stroke-width="1.4"/>
<circle cx="127.6" cy="150" r="8" fill="none" stroke="#0e8f8f" stroke-width="2.2"/>
<text x="119.6" y="120.0" fill="#0e8f8f" font-size="13" text-anchor="start" font-weight="700">1972 첸초프, 러시아어 저서</text>
<text x="119.6" y="136.0" fill="#5b6470" font-size="12" text-anchor="start" font-weight="400">유한 개일 때 피셔 하나뿐</text>
<circle cx="238.5" cy="150" r="4" fill="#5b6470"/>
<text x="230.5" y="172.0" fill="#5b6470" font-size="12" text-anchor="start" font-weight="400">1982 영어판</text>
<circle cx="604.5" cy="150" r="5" fill="#1f2328"/>
<text x="612.5" y="120.0" fill="#1f2328" font-size="12" text-anchor="end" font-weight="400">2015 아이·요스트·레·슈바흐회퍼</text>
<circle cx="615.6" cy="150" r="5" fill="#1f2328"/>
<text x="623.6" y="136.0" fill="#1f2328" font-size="12" text-anchor="end" font-weight="400">2016 바우어·브루베리스·미코르</text>
<line x1="127.6" y1="196.0" x2="604.5" y2="196.0" stroke="#0e8f8f" stroke-width="1.2"/>
<path d="M604.5,196 l-8,-4 v8 z" fill="#0e8f8f"/>
<text x="366.1" y="190.0" fill="#0e8f8f" font-size="12" text-anchor="middle" font-weight="400">43년</text>
<text x="50.0" y="238.0" fill="#1f2328" font-size="13" text-anchor="start" font-weight="700">양자 상태: 단조성을 지키는 계량이 무수히 많다</text>
<line x1="50.0" y1="275.0" x2="660.0" y2="275.0" stroke="#c9ced6" stroke-width="1.4"/>
<circle cx="316.2" cy="275" r="5" fill="#1f2328"/>
<text x="316.2" y="295.0" fill="#1f2328" font-size="12" text-anchor="middle" font-weight="400">1989 모로조바·첸초프</text>
<circle cx="393.8" cy="275" r="5" fill="#1f2328"/>
<text x="401.8" y="266.0" fill="#1f2328" font-size="12" text-anchor="start" font-weight="400">1996 페츠: 한 가족으로 정리</text>
</svg>
