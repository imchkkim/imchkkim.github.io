<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" font-family="'Noto Sans KR', sans-serif">
  <defs>
    <linearGradient id="bg5q" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="460" height="250" fill="url(#bg5q)" rx="10"/>

  <!-- 왼쪽: 후보 8개를 예/아니오 답으로 반씩 줄이기 -->
  <text x="118" y="24" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="700">후보 8개 가운데 하나</text>
  <g font-size="12" fill="#94a3b8">
    <text x="12" y="55">처음</text>
    <text x="12" y="95">답 1개</text>
    <text x="12" y="135">답 2개</text>
    <text x="12" y="175">답 3개</text>
  </g>
  <!-- 줄마다 8칸, 남은 후보만 밝게 -->
  <g stroke="#475569" stroke-width="1">
    <!-- 처음: 8칸 모두 -->
    <g fill="#8b5cf6" fill-opacity="0.55">
      <rect x="60" y="42" width="18" height="18" rx="3"/><rect x="82" y="42" width="18" height="18" rx="3"/>
      <rect x="104" y="42" width="18" height="18" rx="3"/><rect x="126" y="42" width="18" height="18" rx="3"/>
      <rect x="148" y="42" width="18" height="18" rx="3"/><rect x="170" y="42" width="18" height="18" rx="3"/>
      <rect x="192" y="42" width="18" height="18" rx="3"/><rect x="214" y="42" width="18" height="18" rx="3"/>
    </g>
    <!-- 답 1개: 4칸 -->
    <g fill="#1e293b">
      <rect x="60" y="82" width="18" height="18" rx="3"/><rect x="82" y="82" width="18" height="18" rx="3"/>
      <rect x="104" y="82" width="18" height="18" rx="3"/><rect x="126" y="82" width="18" height="18" rx="3"/>
    </g>
    <g fill="#8b5cf6" fill-opacity="0.55">
      <rect x="148" y="82" width="18" height="18" rx="3"/><rect x="170" y="82" width="18" height="18" rx="3"/>
      <rect x="192" y="82" width="18" height="18" rx="3"/><rect x="214" y="82" width="18" height="18" rx="3"/>
    </g>
    <!-- 답 2개: 2칸 -->
    <g fill="#1e293b">
      <rect x="60" y="122" width="18" height="18" rx="3"/><rect x="82" y="122" width="18" height="18" rx="3"/>
      <rect x="104" y="122" width="18" height="18" rx="3"/><rect x="126" y="122" width="18" height="18" rx="3"/>
      <rect x="192" y="122" width="18" height="18" rx="3"/><rect x="214" y="122" width="18" height="18" rx="3"/>
    </g>
    <g fill="#8b5cf6" fill-opacity="0.55">
      <rect x="148" y="122" width="18" height="18" rx="3"/><rect x="170" y="122" width="18" height="18" rx="3"/>
    </g>
    <!-- 답 3개: 1칸 -->
    <g fill="#1e293b">
      <rect x="60" y="162" width="18" height="18" rx="3"/><rect x="82" y="162" width="18" height="18" rx="3"/>
      <rect x="104" y="162" width="18" height="18" rx="3"/><rect x="126" y="162" width="18" height="18" rx="3"/>
      <rect x="148" y="162" width="18" height="18" rx="3"/>
      <rect x="192" y="162" width="18" height="18" rx="3"/><rect x="214" y="162" width="18" height="18" rx="3"/>
    </g>
    <rect x="170" y="162" width="18" height="18" rx="3" fill="#a78bfa" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <g font-size="11.5" fill="#cbd5e1">
    <text x="146" y="75" text-anchor="middle">「앞의 넷 중에 있어?」 아니요</text>
    <text x="146" y="115" text-anchor="middle">「남은 넷 중 앞의 둘?」 예</text>
    <text x="146" y="155" text-anchor="middle">「왼쪽 것?」 아니요</text>
  </g>
  <text x="118" y="206" font-size="12.5" text-anchor="middle" fill="#e2e8f0">확률 <tspan fill="#d6479f">p</tspan> = 1/8 인 결과 → 예/아니오 답 3개</text>
  <text x="118" y="226" font-size="12.5" text-anchor="middle" fill="#e2e8f0">−log₂ (1/8) = <tspan fill="#a78bfa" font-weight="700">3 bit</tspan></text>

  <line x1="248" y1="16" x2="248" y2="234" stroke="#334155" stroke-width="1"/>

  <!-- 오른쪽: 두 소식은 후보가 곱해지고 답이 더해진다 -->
  <text x="354" y="24" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="700">서로 무관한 소식 둘</text>
  <g font-size="13" fill="#cbd5e1">
    <text x="262" y="58">동전</text>
    <text x="392" y="58" text-anchor="end">후보 2개</text>
    <text x="448" y="58" text-anchor="end" fill="#a78bfa">답 1개</text>
    <text x="262" y="88">여덟 칸</text>
    <text x="392" y="88" text-anchor="end">후보 8개</text>
    <text x="448" y="88" text-anchor="end" fill="#a78bfa">답 3개</text>
  </g>
  <line x1="262" y1="102" x2="448" y2="102" stroke="#64748b" stroke-width="1"/>
  <g font-size="13" fill="#e2e8f0">
    <text x="262" y="124">함께</text>
    <text x="392" y="124" text-anchor="end">후보 16개</text>
    <text x="448" y="124" text-anchor="end" fill="#a78bfa" font-weight="700">답 4개</text>
  </g>
  <g font-size="12.5" fill="#94a3b8" text-anchor="middle">
    <text x="354" y="162">후보의 수는 곱해진다: 2 × 8 = 16</text>
    <text x="354" y="184">답의 개수는 더해진다: 1 + 3 = 4</text>
  </g>
  <text x="354" y="220" font-size="12.5" text-anchor="middle" fill="#e2e8f0">곱을 합으로 바꾸는 것 = log</text>
</svg>
