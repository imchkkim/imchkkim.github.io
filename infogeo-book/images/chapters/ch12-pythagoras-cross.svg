<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" font-family="'Noto Sans KR', sans-serif">
  <defs>
    <linearGradient id="bg12c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f5f6"/><stop offset="100%" stop-color="#eeeff1"/>
    </linearGradient>
  </defs>
  <rect width="480" height="470" fill="url(#bg12c)" rx="10"/>
  <!-- 값: p = (0.5, 0.2, 0.3), 모델 q_θ(i) ∝ exp(θ·t(i)), t = (0, 1, 2)
       q_m: θ = −0.305, r: θ = 0 (균등), q: θ = 1
       KL(p‖q) = 0.578, KL(p‖q_m) = 0.039, KL(q_m‖q) = 0.539, KL(p‖r) = 0.069, KL(r‖q) = 0.309
       교차항 (θ_q − θ_r)(η_p − η_r) = 1 × (0.8 − 1.0) = −0.2 -->

  <!-- 위 패널: 발끝 q_m 에서 -->
  <text x="24" y="34" font-size="16" fill="#0f151d" font-weight="600">발끝 qₘ 에서: 빗변 = 두 조각의 합</text>
  <line x1="30" y1="170" x2="450" y2="170" stroke="#345c42" stroke-width="3"/>
  <text x="34" y="195" font-size="15" fill="#4e7e5f">모델 M</text>
  <line x1="130" y1="68" x2="130" y2="170" stroke="#9f2f71" stroke-width="2.4"/>
  <line x1="130" y1="170" x2="390" y2="170" stroke="#9f2f71" stroke-width="2.4"/>
  <line x1="130" y1="68" x2="390" y2="170" stroke="#9f2f71" stroke-width="1.6" stroke-dasharray="6 4"/>
  <polyline points="130,154 146,154 146,170" fill="none" stroke="#0f151d" stroke-width="1.4"/>
  <circle cx="130" cy="68" r="7" fill="#bf2b86"/>
  <circle cx="130" cy="170" r="7" fill="#68750d"/>
  <circle cx="390" cy="170" r="7" fill="#68750d"/>
  <text x="112" y="66" font-size="17" fill="#e03699" text-anchor="end">p</text>
  <text x="122" y="198" font-size="17" fill="#869422" text-anchor="middle">qₘ</text>
  <text x="390" y="198" font-size="17" fill="#869422" text-anchor="middle">q</text>
  <text x="270" y="108" font-size="15" fill="#0f151d" text-anchor="middle">0.578</text>
  <text x="138" y="122" font-size="15" fill="#0f151d">0.039</text>
  <text x="262" y="160" font-size="15" fill="#0f151d" text-anchor="middle">0.539</text>
  <text x="240" y="222" font-size="15" fill="#1e2834" text-anchor="middle">KL(p‖q) = KL(p‖qₘ) + KL(qₘ‖q) : 0.578 = 0.039 + 0.539</text>

  <line x1="20" y1="240" x2="460" y2="240" stroke="#e6e7e9" stroke-width="1"/>

  <!-- 아래 패널: 다른 꼭짓점 r 에서 -->
  <text x="24" y="270" font-size="16" fill="#0f151d" font-weight="600">다른 꼭짓점 r 에서: 교차항만큼 어긋난다</text>
  <line x1="30" y1="400" x2="450" y2="400" stroke="#345c42" stroke-width="3"/>
  <text x="34" y="425" font-size="15" fill="#4e7e5f">모델 M</text>
  <line x1="130" y1="298" x2="210" y2="400" stroke="#9f2f71" stroke-width="2.4"/>
  <line x1="210" y1="400" x2="390" y2="400" stroke="#9f2f71" stroke-width="2.4"/>
  <line x1="130" y1="298" x2="390" y2="400" stroke="#9f2f71" stroke-width="1.6" stroke-dasharray="6 4"/>
  <line x1="130" y1="298" x2="130" y2="400" stroke="#525f72" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="130" cy="298" r="7" fill="#bf2b86"/>
  <circle cx="130" cy="400" r="5" fill="none" stroke="#68750d" stroke-width="2"/>
  <circle cx="210" cy="400" r="7" fill="#68750d"/>
  <circle cx="390" cy="400" r="7" fill="#68750d"/>
  <text x="112" y="296" font-size="17" fill="#e03699" text-anchor="end">p</text>
  <text x="124" y="428" font-size="15" fill="#7084a0" text-anchor="middle">qₘ</text>
  <text x="210" y="428" font-size="17" fill="#869422" text-anchor="middle">r</text>
  <text x="390" y="428" font-size="17" fill="#869422" text-anchor="middle">q</text>
  <text x="290" y="338" font-size="15" fill="#0f151d" text-anchor="middle">0.578</text>
  <text x="182" y="346" font-size="15" fill="#0f151d">0.069</text>
  <text x="300" y="390" font-size="15" fill="#0f151d" text-anchor="middle">0.309</text>
  <text x="240" y="456" font-size="15" fill="#1e2834" text-anchor="middle">0.578 = 0.069 + 0.309 + 0.200 (나머지 0.200 = 교차항)</text>
</svg>
