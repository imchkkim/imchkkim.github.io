<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 350" font-family="'Noto Sans KR', sans-serif">
  <defs>
    <linearGradient id="bg12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arE12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b7de0"/>
    </marker>
    <marker id="arM12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0504a"/>
    </marker>
  </defs>
  <rect width="480" height="350" fill="url(#bg12)" rx="10"/>
  <!-- 데이터 면 D: 위에서 오른쪽 아래로 기울어 모형 면에 다가가지만 닿지 않는다 -->
  <line x1="30" y1="50" x2="450" y2="180" stroke="#b07a8c" stroke-width="3"/>
  <text x="34" y="36" font-size="15" fill="#e2b8c6">데이터 면 𝒟 (m-평탄)</text>
  <!-- 모형 면 M -->
  <line x1="30" y1="240" x2="450" y2="240" stroke="#5f9a74" stroke-width="3"/>
  <text x="446" y="266" font-size="15" fill="#a8d5b5" text-anchor="end">모형 면 M (e-평탄)</text>
  <!-- 지그재그: θ0 → q1 → θ1 → q2 → θ2 → q3 -->
  <circle cx="70" cy="240" r="6" fill="#7f8f10"/>
  <text x="70" y="266" font-size="14" fill="#a3b52a" text-anchor="middle">시작</text>
  <line x1="70" y1="236" x2="94" y2="72" stroke="#3b7de0" stroke-width="2.2" marker-end="url(#arE12)"/>
  <circle cx="96" cy="70" r="5" fill="#7f8f10"/>
  <line x1="98" y1="74" x2="186" y2="234" stroke="#e0504a" stroke-width="2.2" marker-end="url(#arM12)"/>
  <circle cx="188" cy="240" r="5" fill="#7f8f10"/>
  <line x1="188" y1="236" x2="204" y2="108" stroke="#3b7de0" stroke-width="2.2" marker-end="url(#arE12)"/>
  <circle cx="206" cy="105" r="5" fill="#7f8f10"/>
  <line x1="208" y1="109" x2="270" y2="234" stroke="#e0504a" stroke-width="2.2" marker-end="url(#arM12)"/>
  <circle cx="272" cy="240" r="5" fill="#7f8f10"/>
  <line x1="272" y1="236" x2="282" y2="132" stroke="#3b7de0" stroke-width="1.8" marker-end="url(#arE12)" opacity="0.7"/>
  <circle cx="284" cy="129" r="4" fill="#7f8f10" opacity="0.7"/>
  <line x1="286" y1="133" x2="318" y2="234" stroke="#e0504a" stroke-width="1.8" marker-end="url(#arM12)" opacity="0.7"/>
  <!-- 가장 가까운 두 점 -->
  <circle cx="340" cy="240" r="7" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="340" cy="146" r="7" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="340" y1="153" x2="340" y2="233" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="352" y="210" font-size="14" fill="#e2e8f0">가장 가까운</text>
  <text x="352" y="228" font-size="14" fill="#e2e8f0">두 점</text>
  <!-- 이름표 -->
  <line x1="34" y1="290" x2="64" y2="290" stroke="#3b7de0" stroke-width="2.4" marker-end="url(#arE12)"/>
  <text x="74" y="295" font-size="15" fill="#7aa7ee">E-스텝(e-사영): 데이터 면으로</text>
  <line x1="34" y1="314" x2="64" y2="314" stroke="#e0504a" stroke-width="2.4" marker-end="url(#arM12)"/>
  <text x="74" y="319" font-size="15" fill="#f0837e">M-스텝(m-사영): 모형 면으로</text>
  <text x="240" y="341" font-size="13" fill="#94a3b8" text-anchor="middle">걸음마다 두 면 사이의 KL 이 줄어든다(그림 속 길이가 KL 은 아니다)</text>
</svg>
