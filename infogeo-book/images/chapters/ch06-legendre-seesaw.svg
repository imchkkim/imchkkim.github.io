<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 170" font-family="'Noto Sans KR', sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f5f6"/><stop offset="100%" stop-color="#eeeff1"/>
    </linearGradient>
  </defs>
  <rect width="420" height="170" fill="url(#bg6)" rx="10"/>
  <!-- 볼록곡선 F(θ) = 아래로 볼록 (화면 좌표에서 y 가 아래로 커진다) -->
  <polyline points="50,106.0 55,106.8 60,107.4 65,108.0 70,108.6 75,109.0 80,109.4 85,109.6 90,109.8 95,110.0 100,110.0 105,110.0 110,109.8 115,109.6 120,109.4 125,109.0 130,108.6 135,108.0 140,107.4 145,106.8 150,106.0 155,105.2 160,104.2 165,103.2 170,102.2 175,101.0 180,99.8 185,98.4 190,97.0 195,95.6 200,94.0 205,92.4 210,90.6 215,88.8 220,87.0 225,85.0 230,83.0 235,80.8 240,78.6 245,76.4 250,74.0 255,71.6 260,69.0 265,66.4 270,63.8 275,61.0 280,58.2 285,55.2 290,52.2 295,49.2 300,46.0 305,42.8 310,39.4 315,36.0 320,32.6 325,29.0 330,25.4 335,21.6 340,17.8" stroke="#2b45d7" stroke-width="2.2" fill="none"/>
  <text x="344" y="22" fill="#0f1c70" font-size="17">F(θ)</text>
  <!-- θ′ 에서의 접선 (기울기 η) : 곡선 아래에 놓인다 -->
  <line x1="70" y1="124.6" x2="330" y2="66.4" stroke="#d12b24" stroke-width="1.2" stroke-dasharray="5 3"/>
  <circle cx="170" cy="102.2" r="4" fill="#d12b24"/>
  <text x="150" y="130" fill="#7a140f" font-size="15" text-anchor="middle">θ′ (기울기 η)</text>
  <!-- θ 에서의 간격 = 브레그만 발산 -->
  <line x1="280" y1="58.2" x2="280" y2="77.6" stroke="#9f2f71" stroke-width="2.5"/>
  <circle cx="280" cy="58.2" r="3.5" fill="#2b45d7"/>
  <text x="288" y="74" fill="#d7479b" font-size="16">간격</text>
  <text x="280" y="97" fill="#0f1c70" font-size="16" text-anchor="middle">θ</text>
  <text x="210" y="158" fill="#7084a0" font-size="15" text-anchor="middle">곡선과 접선 사이의 간격 = 브레그만 발산</text>
</svg>
